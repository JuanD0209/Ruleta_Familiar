<style>
  :root{
    --bg:#0a2317;
    --bg2:#123524;
    --card:#123a27;
    --accent:#e2484d;
    --accent2:#f4c35e;
    --accent3:#8fd9a8;
    --accent4:#2f7a52;
    --text:#fdf6ec;
    --muted:#b7cdbd;
    --ok:#8fd9a8;
    --pending:#b7cdbd;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    font-family:'Segoe UI', Tahoma, Verdana, sans-serif;
    background:
      radial-gradient(circle at 20% 0%, rgba(244,195,94,0.08), transparent 40%),

    color:var(--text);
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:24px 16px 60px;
    position:relative;
    overflow-x:hidden;
  }
  h1{
    font-family:'Mountains of Christmas', 'Segoe UI', cursive;
    text-align:center;
    font-size:2.6rem;
    font-weight:700;
    margin:10px 0 2px;
    color:var(--accent2);
    text-shadow:0 2px 10px rgba(244,195,94,0.35);

  p.subtitle{
    color:var(--muted);
    text-align:center;
    margin:0 0 20px;

  }
  .lights{
    display:flex;
    gap:14px;
    margin:2px 0 18px;
    padding:0;
    list-style:none;
  }
  .lights span{
    width:10px;
    height:14px;
    border-radius:50% 50% 45% 45%;
    display:block;
    animation:twinkle 1.6s ease-in-out infinite;
  }
  .lights li:nth-child(5n+1) span{ background:var(--accent); box-shadow:0 0 8px var(--accent); }
  .lights li:nth-child(5n+2) span{ background:var(--accent2); box-shadow:0 0 8px var(--accent2); }
  .lights li:nth-child(5n+3) span{ background:var(--accent3); box-shadow:0 0 8px var(--accent3); }
  .lights li:nth-child(5n+4) span{ background:var(--accent4); box-shadow:0 0 8px var(--accent4); }
  .lights li:nth-child(5n+5) span{ background:#e8e3d5; box-shadow:0 0 8px #e8e3d5; }
  .lights li:nth-child(odd) span{ animation-delay:.4s; }
  .lights li:nth-child(3n) span{ animation-delay:.8s; }
  @keyframes twinkle{
    0%, 100%{ opacity:0.45; transform:scale(0.9); }
    50%{ opacity:1; transform:scale(1.1); }

  .photo-strip{
    display:flex;

  .photo-strip figure{

  .photo-strip figure:nth-child(1){ transform:rotate(-4deg); }
  .photo-strip figure:nth-child(2){ transform:rotate(2deg); }
  .photo-strip figure:nth-child(3){ transform:rotate(-1deg); }
  .photo-strip img{
    display:block;
    width:112px;
    height:112px;
    object-fit:cover;
    border-radius:2px;
  }
  @media (prefers-reduced-motion: reduce){
    .lights span{ animation:none; opacity:0.9; }
  }
  .card{
    background:var(--card);
    border-radius:20px;
    padding:24px;
    width:100%;
    max-width:440px;
    box-shadow:0 10px 40px rgba(0,0,0,0.4);

  select{
    width:100%;
    padding:12px 14px;
    border-radius:12px;

    background:#0f2d1e;

  select:disabled{ opacity:0.6; }
  button{
    border:none;
    border-radius:12px;
    padding:12px 20px;

  button:disabled{ opacity:0.5; cursor:not-allowed; }
  .btn-main{
    background:linear-gradient(135deg, var(--accent), var(--accent4));

  }
  .wheel-wrap{
    position:relative;
    width:300px;
    height:300px;
    margin:10px auto 20px;
  }
  .pointer{
    position:absolute;
    top:-14px;
    left:50%;
    transform:translateX(-50%);
    width:0; height:0;
    border-left:14px solid transparent;
    border-right:14px solid transparent;
    border-top:22px solid var(--accent2);

  .wheel-outer{
    width:100%;
    height:100%;
    border-radius:50%;
    border:8px solid #0f2d1e;
    overflow:hidden;
    position:relative;
    box-shadow:inset 0 0 20px rgba(0,0,0,0.5), 0 0 0 4px rgba(255,255,255,0.05);
  }
  .wheel{
    width:100%;
    height:100%;
    position:relative;
    transform:rotate(0deg);
  }
  .wheel-center-dot{
    position:absolute;
    top:50%; left:50%;
    width:16px; height:16px;
    background:var(--accent2);
    border-radius:50%;
    transform:translate(-50%,-50%);
    z-index:4;
    box-shadow:0 0 0 4px var(--card);

  .segment-label{
    position:absolute;
    top:50%;
    left:50%;
    width:140px;
    margin-left:-70px;
    text-align:right;
    font-size:0.72rem;
    font-weight:700;
    color:#0a2317;
    text-shadow:0 1px 0 rgba(255,255,255,0.3);
    pointer-events:none;
    white-space:nowrap;
    overflow:hidden;

  }
  .result-box{
    margin-top:12px;
    padding:18px;
    border-radius:14px;
    background:linear-gradient(135deg, rgba(79,209,197,0.15), rgba(123,97,255,0.15));
    border:1px solid rgba(255,255,255,0.1);

  }
  .result-box b{
    color:var(--accent2);

  }
  .hint{
    color:var(--muted);
    font-size:0.85rem;
    margin-top:10px;
  }
  .conn-note{
    color:var(--muted);
    font-size:0.8rem;
    margin-top:14px;
  }
  .footer-actions{
    margin-top:30px;
    width:100%;
    max-width:440px;
    text-align:center;
  }
  .btn-reset{
    background:transparent;
    color:var(--muted);
    border:1px solid rgba(255,255,255,0.15);
    font-size:0.8rem;

  .status-pill{
    display:inline-block;
    background:rgba(255,255,255,0.08);
    color:var(--muted);
    font-size:0.75rem;
    padding:4px 10px;

  }
  details.dashboard{
    margin-top:18px;
    width:100%;
    max-width:440px;
    background:var(--card);
    border-radius:16px;
    padding:4px 18px;
  }
  details.dashboard summary{
    cursor:pointer;
    padding:12px 0;
    color:var(--muted);
    font-size:0.9rem;
    font-weight:600;
  }
  .dash-list{
    list-style:none;
    margin:0;
    padding:0 0 14px;
  }
  .dash-list li{
    display:flex;
    justify-content:space-between;
    padding:6px 0;
    font-size:0.88rem;

  .dash-list li:first-child{ border-top:none; }
  .dash-ok{ color:var(--ok); font-weight:600; }
  .dash-pending{ color:var(--pending); }
  .pin-input{
    width:100%;
    padding:12px 14px;
    border-radius:12px;
    border:none;
    font-size:1rem;

    color:var(--text);

  .auth-box p{ margin:0 0 12px; line-height:1.4; }
  .auth-error{
    color:var(--accent);
    font-size:0.85rem;

  }
  .snow{
    position:fixed;
    inset:0;
    pointer-events:none;
    overflow:hidden;
    z-index:0;
  }
  .snow span{
    position:absolute;
    top:-10px;
    color:#fdf6ec;
    opacity:0.75;
    animation:fall linear infinite;
  }
  @keyframes fall{
    to{ transform:translateY(110vh) translateX(var(--drift,0px)); }
  }
  body > *:not(.snow){ position:relative; z-index:1; }
  @media (prefers-reduced-motion: reduce){
    .snow{ display:none; }
  }
</style>

<body>

  <div class="snow" id="snow" aria-hidden="true"></div>

  <h1>🎄 Amigo Navideño Familiar</h1>
  <ul class="lights" aria-hidden="true">
    <li><span></span></li><li><span></span></li><li><span></span></li><li><span></span></li><li><span></span></li>
    <li><span></span></li><li><span></span></li><li><span></span></li><li><span></span></li><li><span></span></li>
  </ul>
  <p class="subtitle">Selecciona tu nombre y crea (o ingresa) tu clave para ver tu resultado. El resultado se sincroniza al instante en todos los dispositivos: nadie puede girar dos veces, ni ver el resultado de otra persona sin su clave.</p>

  <div class="photo-strip">
    <figure><img src="Fotos/1.jpeg" alt="Foto familiar 1" loading="lazy"></figure>
    <figure><img src="Fotos/2.jpeg" alt="Foto familiar 2" loading="lazy"></figure>
    <figure><img src="Fotos/3.jpeg" alt="Foto familiar 3" loading="lazy"></figure>
  </div>

  <div class="card">
    <div id="statusPill" class="status-pill" style="display:none;"></div>

    <select id="personSelect" disabled>
      <option value="" disabled selected>-- Conectando... --</option>
    </select>

    <div id="greeting" class="hint"></div>

    <div id="authArea"></div>

    <div id="wheelArea"></div>

    <div id="actionArea"></div>

    <div id="resultArea"></div>

    <div id="connNote" class="conn-note"></div>

  <details class="dashboard">
    <summary>📋 Ver estado general (en vivo)</summary>

  <div class="footer-actions">
    <button class="btn-reset" id="resetBtn">¿Cómo reinicio el sorteo completo?</button>
  </div>

<script type="module">
  "use strict";

  // ============================================================
  // SUPABASE: reemplaza esto con la URL y la "anon key" de TU
  // proyecto (Supabase dashboard -> Settings -> API).
  // Mientras diga "TU_SUPABASE_URL", la página funciona en modo
  // local (solo en este dispositivo) para que puedas probarla.
  //
  // Antes de que esto funcione, en el SQL Editor de tu proyecto
  // de Supabase corre:
  //
  //   create table reveals (
  //     giver_id text primary key,
  //     revealed_at timestamptz default now()
  //   );
  //   alter table reveals enable row level security;
  //   create policy "lectura publica" on reveals
  //     for select using (true);
  //   create policy "insercion publica" on reveals
  //     for insert with check (true);
  //   alter publication supabase_realtime add table reveals;
  //
  //   create table claims (
  //     giver_id text primary key,
  //     pin_hash text not null,
  //     created_at timestamptz default now()
  //   );
  //   alter table claims enable row level security;
  //   create policy "lectura publica claims" on claims
  //     for select using (true);
  //   create policy "insercion publica claims" on claims
  //     for insert with check (true);
  //   alter publication supabase_realtime add table claims;
  //
  // (No se crean políticas de UPDATE ni DELETE a propósito: así
  // nadie puede borrar o pisar un resultado ya revelado, ni
  // cambiar la clave de otra persona, desde el navegador.)
  // ============================================================
  const SUPABASE_URL = "https://zqcqdqezsigiopuqzodx.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_PPiG6Zfvg6d251Ixrh3kKQ_Y7cbEgoB";

  const REVEALS_TABLE = "reveals";
  const CLAIMS_TABLE = "claims";
  let supabaseClient = null;
  let supabaseEnabled = false;

  async function initSupabase(){
    if(!SUPABASE_URL || SUPABASE_URL === "TU_SUPABASE_URL") return false;
    try{
      const { createClient } = await import("https://esm.sh/@supabase/supabase-js@2");
      supabaseClient = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      return true;
    }catch(e){
      console.error("No se pudo inicializar Supabase, se usará modo local:", e);
      return false;
    }
  }

  // ---------- Datos de participantes y restricciones ----------
  // Las personas con el mismo "group" NO pueden salirse entre ellas.
  // group = null significa sin restricción especial (aparte de la básica).
  const PEOPLE = [
    { id: "maria_clara",    name: "Maria Clara",    group: "A" },
    { id: "carlos",         name: "Carlos",          group: "A" },
    { id: "daniela",        name: "Daniela",         group: "A" },

    { id: "johana",         name: "Johana",          group: "B" },
    { id: "maria_antonia",  name: "Maria Antonia",   group: "B" },
    { id: "beatriz",        name: "Beatriz",         group: "B" },
    { id: "juan_david",     name: "Juan David",      group: "B" },

    { id: "yesica",         name: "Yesica",          group: "C" },
    { id: "luisfer",        name: "Luisfer",         group: "C" },

    { id: "esteban",        name: "Esteban",         group: "D" },
    { id: "mari_luz",       name: "Mari Luz",        group: "D" },
    { id: "alejo",          name: "Alejo",           group: "D" },

    { id: "estella",        name: "Estella",         group: null }
  ];

  const LOCAL_KEY = "amigoSecretoFamiliar_local_revealed";
  const SPIN_COLORS = ["#e2484d","#f4c35e","#8fd9a8","#2f7a52","#f28b82","#d4af37","#c75c5c","#6fae8c"];

  // Semilla fija: hace que el sorteo sea SIEMPRE el mismo en cualquier
  // dispositivo/navegador que abra esta página, sin necesidad de servidor.
  // Si algún día quieres un sorteo nuevo, cambia este número.
  const DRAW_SEED = 73918426;

  // ---------- PRNG determinista (mulberry32) ----------
  function makeRng(seed){
    let s = seed >>> 0;
    return function(){
      s = (s + 0x6D2B79F5) | 0;
      let t = Math.imul(s ^ (s >>> 15), 1 | s);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  function shuffle(arr, rng){
    const a = arr.slice();
    for(let i=a.length-1;i>0;i--){
      const j = Math.floor(rng()*(i+1));
      [a[i],a[j]] = [a[j],a[i]];
    }
    return a;
  }

  function isValidPerm(perm){
    for(let i=0;i<PEOPLE.length;i++){
      if(perm[i] === i) return false;
      const giver = PEOPLE[i];
      const recipient = PEOPLE[perm[i]];
      if(giver.group !== null && giver.group === recipient.group) return false;
    }
    return true;
  }

  function backtrackAssign(rng){
    const n = PEOPLE.length;
    const giverOrder = shuffle([...Array(n).keys()], rng);
    const used = new Array(n).fill(false);
    const perm = new Array(n).fill(-1);

    function valid(giverIdx, recipientIdx){
      if(giverIdx === recipientIdx) return false;
      const giver = PEOPLE[giverIdx];
      const recipient = PEOPLE[recipientIdx];
      if(giver.group !== null && giver.group === recipient.group) return false;
      return true;
    }

    function backtrack(pos){
      if(pos === n) return true;
      const giverIdx = giverOrder[pos];
      const candidates = shuffle([...Array(n).keys()].filter(i=>!used[i]), rng);
      for(const recIdx of candidates){
        if(valid(giverIdx, recIdx)){
          used[recIdx] = true;
          perm[giverIdx] = recIdx;
          if(backtrack(pos+1)) return true;
          used[recIdx] = false;
          perm[giverIdx] = -1;
        }
      }
      return false;
    }

    backtrack(0);
    return perm;
  }

  function generateAssignment(){
    const rng = makeRng(DRAW_SEED);
    const n = PEOPLE.length;
    for(let attempt=0; attempt<20000; attempt++){
      const perm = shuffle([...Array(n).keys()], rng);
      if(isValidPerm(perm)) return perm;
    }
    return backtrackAssign(rng);
  }

  // La asignación es 100% determinista: todo dispositivo que abra esta
  // misma página calcula exactamente el mismo sorteo, sin necesidad de
  // sincronizar nada por internet.
  const ASSIGNMENT = generateAssignment();

  // ---------- Estado de "quién ya giró" ----------
  const state = { revealedGivers: [], ready: false };
  let currentGiverIdx = null;

  function idxFromGiverId(id){
    return PEOPLE.findIndex(p => p.id === id);
  }

  function applyRevealedIds(ids){
    state.revealedGivers = ids.map(idxFromGiverId).filter(i => i !== -1);
  }

  function loadLocalRevealedIds(){
    try{
      const raw = localStorage.getItem(LOCAL_KEY);
      const arr = raw ? JSON.parse(raw) : [];
      return Array.isArray(arr) ? arr : [];
    }catch(e){ return []; }
  }

  function saveLocalRevealedIds(ids){
    localStorage.setItem(LOCAL_KEY, JSON.stringify(ids));
  }

  function localMark(giverId){
    const ids = loadLocalRevealedIds();
    if(!ids.includes(giverId)){
      ids.push(giverId);
      saveLocalRevealedIds(ids);
    }
    applyRevealedIds(ids);
  }

  function recipientOf(giverIdx){
    return ASSIGNMENT[giverIdx];
  }

  function alreadyGivenOutRecipientIndexes(){
    return new Set(state.revealedGivers.map(gIdx => ASSIGNMENT[gIdx]));
  }

  async function markRevealed(giverIdx){
    const giverId = PEOPLE[giverIdx].id;
    if(supabaseEnabled){
      try{
        const { error } = await supabaseClient.from(REVEALS_TABLE).insert({ giver_id: giverId });
        if(error && error.code !== "23505"){ // 23505 = ya existía (alguien lo insertó primero), lo ignoramos
          throw error;
        }
      }catch(e){
        console.error("No se pudo guardar en Supabase, se guarda solo local:", e);
        localMark(giverId);
      }
    } else {
      localMark(giverId);
    }
  }

  // ---------- Clave personal (misma para todos el enlace, protege el resultado) ----------
  const LOCAL_CLAIMS_KEY = "amigoSecretoFamiliar_local_claims";
  const claimsMap = {}; // giver_id -> pin_hash
  let authenticated = false;

  async function hashPin(pin){
    const enc = new TextEncoder().encode(pin);
    const buf = await crypto.subtle.digest("SHA-256", enc);
    return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, "0")).join("");
  }

  function loadLocalClaims(){
    try{
      const raw = localStorage.getItem(LOCAL_CLAIMS_KEY);
      return raw ? JSON.parse(raw) : {};
    }catch(e){ return {}; }
  }

  function saveLocalClaims(map){
    localStorage.setItem(LOCAL_CLAIMS_KEY, JSON.stringify(map));
  }

  async function loadClaims(){
    if(supabaseEnabled){
      try{
        const { data, error } = await supabaseClient.from(CLAIMS_TABLE).select("giver_id, pin_hash");
        if(error) throw error;
        (data || []).forEach(r => { claimsMap[r.giver_id] = r.pin_hash; });

        supabaseClient
          .channel("claims-sync")
          .on("postgres_changes", { event: "INSERT", schema: "public", table: CLAIMS_TABLE }, (payload) => {
            claimsMap[payload.new.giver_id] = payload.new.pin_hash;
          })
          .subscribe();
      }catch(e){
        console.error("No se pudieron cargar las claves desde Supabase:", e);
      }
    } else {
      Object.assign(claimsMap, loadLocalClaims());
    }
  }

  async function createClaim(giverId, pin){
    const hash = await hashPin(pin);
    if(supabaseEnabled){
      const { error } = await supabaseClient.from(CLAIMS_TABLE).insert({ giver_id: giverId, pin_hash: hash });
      if(error){
        if(error.code === "23505") return { ok: false, reason: "already_claimed" };
        return { ok: false, reason: "error" };
      }
    } else {
      saveLocalClaims({ ...loadLocalClaims(), [giverId]: hash });
    }
    claimsMap[giverId] = hash;
    return { ok: true };
  }

  async function verifyPin(giverId, pin){
    const hash = await hashPin(pin);
    return claimsMap[giverId] === hash;
  }

  // ---------- UI ----------
  const personSelect = document.getElementById("personSelect");
  const authArea = document.getElementById("authArea");
  const wheelArea = document.getElementById("wheelArea");
  const actionArea = document.getElementById("actionArea");
  const resultArea = document.getElementById("resultArea");
  const statusPill = document.getElementById("statusPill");
  const connNote = document.getElementById("connNote");
  const resetBtn = document.getElementById("resetBtn");
  const dashboardList = document.getElementById("dashboardList");
  const greeting = document.getElementById("greeting");

  function updateStatusPill(){
    const done = state.revealedGivers.length;
    const total = PEOPLE.length;
    statusPill.style.display = "inline-block";
    statusPill.textContent = `${done} de ${total} ya giraron`;
  }

  function renderDashboard(){
    dashboardList.innerHTML = "";
    PEOPLE.forEach((p, idx) => {
      const li = document.createElement("li");
      const already = state.revealedGivers.includes(idx);
      li.innerHTML = `<span>${p.name}</span><span class="${already ? "dash-ok" : "dash-pending"}">${already ? "✅ Ya giró" : "⏳ Pendiente"}</span>`;
      dashboardList.appendChild(li);
    });
  }

  function renderGate(){
    wheelArea.innerHTML = "";
    actionArea.innerHTML = "";
    resultArea.innerHTML = "";
    authArea.innerHTML = "";
    updateStatusPill();

    if(currentGiverIdx === null){
      greeting.textContent = "";
      return;
    }

    const giver = PEOPLE[currentGiverIdx];
    const giverId = giver.id;

    if(authenticated){
      greeting.textContent = `Hola, ${giver.name} 👋`;
      renderForPerson(currentGiverIdx);
      return;
    }

    greeting.textContent = "";
    const hasClaim = !!claimsMap[giverId];

    const box = document.createElement("div");
    box.className = "result-box auth-box";

    const input = document.createElement("input");
    input.type = "password";
    input.className = "pin-input";
    input.autocomplete = "off";
    input.inputMode = "numeric";
    input.pattern = "[0-9]*";
    input.maxLength = 4;

    const errorMsg = document.createElement("div");
    errorMsg.className = "auth-error";

    const btn = document.createElement("button");
    btn.className = "btn-main";

    if(!hasClaim){
      box.innerHTML = `<p>Hola <b>${giver.name}</b>. Es tu primera vez aquí: ingresa 4 números que recuerdes, esa será tu clave para proteger tu resultado (la necesitarás cada vez que quieras volver a verlo). <b>No la olvides</b>, no se puede recuperar.</p>`;
      input.placeholder = "4 números";
      btn.textContent = "Guardar clave y continuar";
    } else {
      box.innerHTML = `<p>Hola <b>${giver.name}</b>. Ingresa tus 4 números para ver tu resultado.</p>`;
      input.placeholder = "4 números";
      btn.textContent = "Ingresar";
    }

    box.appendChild(input);
    box.appendChild(errorMsg);
    box.appendChild(btn);
    authArea.appendChild(box);
    input.focus();

    async function attempt(){
      const pin = input.value.trim();
      if(!hasClaim){
        if(!/^\d{4}$/.test(pin)){
          errorMsg.textContent = "Ingresa exactamente 4 números.";
          return;
        }
        btn.disabled = true;
        const res = await createClaim(giverId, pin);
        btn.disabled = false;
        if(res.ok){
          authenticated = true;
          renderGate();
        } else if(res.reason === "already_claimed"){
          errorMsg.textContent = "Alguien ya creó una clave para este nombre justo ahora. Si eres tú, ingresa tu clave.";
          renderGate();
        } else {
          errorMsg.textContent = "Ocurrió un error, intenta de nuevo.";
        }
      } else {
        btn.disabled = true;
        const ok = await verifyPin(giverId, pin);
        btn.disabled = false;
        if(ok){
          authenticated = true;
          renderGate();
        } else {
          errorMsg.textContent = "Clave incorrecta.";
          input.value = "";
          input.focus();
        }
      }
    }

    btn.addEventListener("click", attempt);
    input.addEventListener("keydown", (e) => { if(e.key === "Enter") attempt(); });
  }

  function renderForPerson(giverIdx){
    wheelArea.innerHTML = "";
    actionArea.innerHTML = "";
    resultArea.innerHTML = "";
    updateStatusPill();

    const giver = PEOPLE[giverIdx];
    const alreadySpun = state.revealedGivers.includes(giverIdx);

    if(alreadySpun){
      const recIdx = recipientOf(giverIdx);
      resultArea.innerHTML = `
        <div class="result-box">
          Ya giraste, <b>${giver.name}</b>.<br>
          Tu amigo navideño es: <b>${PEOPLE[recIdx].name}</b> 🎉
        </div>
        <div class="hint">Shhh... no se lo digas a nadie 🤫</div>
      `;
      return;
    }

    // Candidatos visibles en la ruleta: no revelados aun como recipiente,
    // distintos de si mismo, y fuera de su grupo restringido.
    const takenRecipients = alreadyGivenOutRecipientIndexes();
    const candidateIdxs = PEOPLE
      .map((p, idx) => idx)
      .filter(idx => idx !== giverIdx)
      .filter(idx => !takenRecipients.has(idx))
      .filter(idx => giver.group === null || PEOPLE[idx].group !== giver.group);

    const targetIdx = recipientOf(giverIdx);
    if(!candidateIdxs.includes(targetIdx)){
      candidateIdxs.push(targetIdx); // salvaguarda, no debería ocurrir
    }

    buildWheel(candidateIdxs, targetIdx, giverIdx);
  }

  function refreshCurrentView(){
    if(currentGiverIdx !== null){
      renderGate();
    } else {
      updateStatusPill();
    }
    renderDashboard();
  }

  personSelect.addEventListener("change", () => {
    const idx = parseInt(personSelect.value, 10);
    if(isNaN(idx)) return;
    currentGiverIdx = idx;
    authenticated = false;
    renderGate();
  });

  function buildWheel(candidateIdxs, targetIdx, giverIdx){
    const wrap = document.createElement("div");
    wrap.className = "wheel-wrap";

    const pointer = document.createElement("div");
    pointer.className = "pointer";
    wrap.appendChild(pointer);

    const outer = document.createElement("div");
    outer.className = "wheel-outer";

    const wheel = document.createElement("div");
    wheel.className = "wheel";

    const n = candidateIdxs.length;
    const segAngle = 360 / n;

    const gradientParts = [];
    candidateIdxs.forEach((pIdx, k) => {
      const color = SPIN_COLORS[k % SPIN_COLORS.length];
      const start = k * segAngle;
      const end = (k+1) * segAngle;
      gradientParts.push(`${color} ${start}deg ${end}deg`);
    });
    wheel.style.background = `conic-gradient(${gradientParts.join(",")})`;

    candidateIdxs.forEach((pIdx, k) => {
      const centerAngle = k * segAngle + segAngle/2;
      const label = document.createElement("div");
      label.className = "segment-label";
      label.textContent = PEOPLE[pIdx].name;
      label.style.left = "50%";
      label.style.top = "50%";
      label.style.width = "120px";
      label.style.marginLeft = "0";
      label.style.marginTop = "-0.6em";
      label.style.textAlign = "right";
      label.style.transformOrigin = "0% 50%";
      label.style.transform = `rotate(${centerAngle}deg) translateX(14px)`;
      wheel.appendChild(label);
    });

    const dot = document.createElement("div");
    dot.className = "wheel-center-dot";
    wheel.appendChild(dot);

    outer.appendChild(wheel);
    wrap.appendChild(outer);
    wheelArea.appendChild(wrap);

    const targetK = candidateIdxs.indexOf(targetIdx);
    const centerAngleTarget = targetK * segAngle + segAngle/2;
    const desiredMod = (360 - centerAngleTarget + 360) % 360;
    const fullTurns = 5;
    const finalRotation = fullTurns * 360 + desiredMod;

    const spinBtn = document.createElement("button");
    spinBtn.className = "btn-main";
    spinBtn.textContent = "🎡 Girar la ruleta";
    actionArea.appendChild(spinBtn);

    spinBtn.addEventListener("click", () => {
      spinBtn.disabled = true;
      wheel.style.transition = "transform 3.2s cubic-bezier(0.17, 0.67, 0.12, 0.99)";
      wheel.style.transform = `rotate(${finalRotation}deg)`;

      setTimeout(async () => {
        await markRevealed(giverIdx);
        renderForPerson(giverIdx);
        renderDashboard();
      }, 3300);
    });
  }

  resetBtn.addEventListener("click", () => {
    if(supabaseEnabled){
      alert(
        "Para reiniciar el sorteo completo:\n\n" +
        "1. Entra a tu proyecto de Supabase -> Table Editor.\n" +
        "2. Abre la tabla 'reveals'.\n" +
        "3. Borra todas las filas.\n\n" +
        "Por seguridad, borrar el progreso de todos NO se puede hacer desde esta página (así nadie puede hacer trampa borrando su propio resultado)."
      );
    } else {
      const sure = confirm(
        "Estás en modo local (sin Supabase configurado).\n\n¿Quieres borrar el progreso guardado en ESTE dispositivo?"
      );
      if(!sure) return;
      saveLocalRevealedIds([]);
      applyRevealedIds([]);
      refreshCurrentView();
    }
  });

  // ---------- Arranque ----------
  function finishLoading(message){
    state.ready = true;
    connNote.textContent = message;
    personSelect.disabled = false;
    personSelect.options[0].textContent = "-- Selecciona tu nombre --";
    refreshCurrentView();
  }

  async function start(){
    PEOPLE.forEach((p, idx) => {
      const opt = document.createElement("option");
      opt.value = idx;
      opt.textContent = p.name;
      personSelect.appendChild(opt);
    });

    supabaseEnabled = await initSupabase();

    if(supabaseEnabled){
      try{
        const { data, error } = await supabaseClient.from(REVEALS_TABLE).select("giver_id");
        if(error) throw error;
        applyRevealedIds((data || []).map(r => r.giver_id));

        supabaseClient
          .channel("reveals-sync")
          .on("postgres_changes", { event: "INSERT", schema: "public", table: REVEALS_TABLE }, (payload) => {
            const ids = new Set(state.revealedGivers.map(idx => PEOPLE[idx].id));
            ids.add(payload.new.giver_id);
            applyRevealedIds([...ids]);
            refreshCurrentView();
          })
          .subscribe();

        await loadClaims();
        finishLoading("🟢 Sincronizado en vivo con todos los dispositivos.");
      }catch(e){
        console.error("Error conectando con Supabase:", e);
        supabaseEnabled = false;
        applyRevealedIds(loadLocalRevealedIds());
        await loadClaims();
        finishLoading("🟡 No se pudo conectar: funcionando solo en este dispositivo.");
      }
    } else {
      applyRevealedIds(loadLocalRevealedIds());
      await loadClaims();
      finishLoading("🟡 Modo local: el progreso solo se guarda en este dispositivo (configura Supabase para sincronizar entre todos).");
    }
  }

  function initSnow(){
    const el = document.getElementById("snow");
    if(!el || window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    const count = window.innerWidth < 500 ? 18 : 28;
    for(let i=0;i<count;i++){
      const flake = document.createElement("span");
      flake.textContent = Math.random() > 0.5 ? "❄" : "❅";
      flake.style.left = (Math.random()*100) + "vw";
      flake.style.fontSize = (10 + Math.random()*14) + "px";
      flake.style.animationDuration = (8 + Math.random()*10) + "s";
      flake.style.animationDelay = "-" + (Math.random()*10) + "s";
      flake.style.setProperty("--drift", (Math.random()*80 - 40) + "px");
      el.appendChild(flake);
    }
  }

  initSnow();
  start();
</script>
</body>
